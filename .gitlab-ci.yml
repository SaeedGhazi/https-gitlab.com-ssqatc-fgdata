variables:

  TEST_DATA_DIR: $CI_PROJECT_DIR/testFGData

create-test-data:
  stage: deploy

  script:
    - mkdir $TEST_DATA_DIR
    - cp *.xml $TEST_DATA_DIR
    - cp version $TEST_DATA_DIR

    - mkdir -p $TEST_DATA_DIR/AI/Aircraft
    - cp AI/Aircraft/*.xml $TEST_DATA_DIR/AI/Aircraft/
    - cp AI/*.xml $TEST_DATA_DIR/AI/

    - mkdir -p $TEST_DATA_DIR/ATC/
    - cp ATC/*.xml $TEST_DATA_DIR/ATC/



    - cp -r Environment Nasal Timezone Navaids Airports Input $TEST_DATA_DIR
  # needs:
  #   - project: flightgear/openscenegraph
  #     job: linux-build
  #     ref: fgfs-osg-36-2
  #     artifacts: true
  artifacts:
    paths:
      - $TEST_DATA_DIR